[workspace]
resolver = "2"

members = [
    "api",
    "basic_bootloader",
    "basic_system",
    "callable_oracles",
    "crypto",
    "evm_interpreter",
    "forward_system",
    "oracle_provider",
    "proof_running_system",
    "storage_models",
    "zk_ee",
    "zksync_os_runner",
    "system_hooks",
    "supporting_crates/modexp",
    "supporting_crates/keccak",
    "supporting_crates/solidity_abi",
    "supporting_crates/solidity_abi_derive",
    "basic_system/src/system_implementation/ethereum_storage_model/supporting_crates/cc-traits",
    "tests/common",
    "tests/rig",
    "tests/instances/transactions",
    "tests/instances/erc20",
    "tests/instances/forge_tests",
    "tests/instances/precompiles",
    "tests/instances/bench",
    "tests/instances/unit",
    "tests/instances/system_hooks",
    "tests/instances/multiblock_batch",
    "tests/instances/header",
    "tests/instances/interop",
    "tests/instances/evm",
    "tests/block_reexecutor",
    "tests/revm_runner",
    "cycle_marker",
    "tests/binary_checker",
    "supporting_crates/delegated_u256",
    "supporting_crates/u256",
    "scripts"
]

exclude = [
    "zksync_os",
    "supporting_crates/nostd_compression",
    "crypto/src/blake2s/test_program",
    "circuit_test_program",
    "tests/evm_tester",
    "tests/evm_divergence_validator",
    "tests/instances/eth_runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[workspace.dependencies]
# BLOCKS MERGE: cut a new zksync-os-interface release containing
# `BlockContext.is_gateway` (currently only on `ra/add-gw-to-blockcontext`)
# before merging this PR.
zksync_os_evm_errors = { git = "https://github.com/matter-labs/zksync-os-interface.git", rev = "a8785751b44a356bb6a70e147bec62b9ec2c8e42", default-features = false }
zksync_os_interface = { git = "https://github.com/matter-labs/zksync-os-interface.git", rev = "a8785751b44a356bb6a70e147bec62b9ec2c8e42" }

# zksync-airbender deps pinned to the same commit airbender-platform
# resolves `branch = "dev"` to at the time of pinning.
riscv_transpiler = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a" }
blake2s_u32 = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a", default-features = false }
common_constants = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a" }
prover_examples = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a" }
execution_utils = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a" }
prover = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a" }
full_statement_verifier = { git = "https://github.com/matter-labs/zksync-airbender", rev = "591efe90f1a5f0e0cfe23ac366bf0fc221fbfe0a", default-features = false }
cli = { git = "https://github.com/matter-labs/zksync-airbender", rev = "73f46c2bc86cdcefb878d6675abfcfc0eaf04607" }
gpu_prover = { git = "https://github.com/matter-labs/zksync-airbender", rev = "73f46c2bc86cdcefb878d6675abfcfc0eaf04607" }

airbender-guest = { git = "https://github.com/matter-labs/airbender-platform", rev = "7e559f95" }
airbender-host = { git = "https://github.com/matter-labs/airbender-platform", rev = "7e559f95" }
airbender-sdk = { git = "https://github.com/matter-labs/airbender-platform", rev = "7e559f95" }

ruint = { version = "1.16", default-features = false }
arrayvec = { version = "0.7", default-features = false }
serde = { version = "1", default-features = false }
hex = "0.4.3"
paste = "1.0.15"
strum_macros = "0.27.1"
cfg-if = "1.0.4"
either = { version = "1.15.0", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
num-integer = { version = "0.1", default-features = false }
proptest = "1.7.0"
alloy = { version = "1", default-features = false }
alloy-rlp = "0.3.13"
alloy-sol-types = "1"
alloy-primitives = "1"
alloy-rpc-types-debug = { version = "1", default-features = false }
reqwest = "0.12"
serde_json = "1"
log = "0.4.22"
env_logger = "0.11.6"
once_cell = "1.20.3"

# zerocopy 0.8.29 introduced a compilation issue, remove this
# when the compilation issue is resolved
zerocopy = { version = "=0.8.28" }


[profile.dev]
# The Airbender dependency graph currently triggers an LLVM/DWARF SIGBUS
# on this toolchain when compiling debug-info-heavy host builds.
debug = false

[profile.test]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

