name: Install cargo-airbender
description: Install the cargo-airbender build tool from airbender-platform
inputs:
  rev:
    description: Git revision of airbender-platform to install from
    default: "097f1489"
runs:
  using: composite
  steps:
    - shell: bash
      run: cargo install cargo-airbender --git https://github.com/matter-labs/airbender-platform --rev ${{ inputs.rev }} --locked
