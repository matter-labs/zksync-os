name: Set up Rust toolchain
description: |
  Set up the Rust toolchain plus cargo-binutils and cargo-airbender for
  zksync_os RISC-V builds. Uses the project's rust-toolchain.toml for the
  compiler version.
inputs:
  rev:
    description: Git revision of airbender-platform to install cargo-airbender from
    default: "9e779f81"
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
    - shell: bash
      run: |
        git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
    - shell: bash
      env:
        # cargo-airbender pulls in era_cudart_sys, whose build script panics
        # on runners without a CUDA toolkit unless stubs are enabled.
        ZKSYNC_USE_CUDA_STUBS: true
      run: |
        rustup set profile minimal
        cargo install cargo-binutils --locked
        cargo install cargo-airbender --git https://github.com/matter-labs/airbender-platform --rev ${{ inputs.rev }} --locked
