name: Set up Rust toolchain
description: |
  Set up the Rust toolchain plus cargo-binutils and cargo-airbender for
  zksync_os RISC-V builds. Uses the project's rust-toolchain.toml for the
  compiler version.
inputs:
  rev:
    description: Git revision of airbender-platform to install cargo-airbender from
    default: "440228df"
  release-token:
    description: |
      Token used to fetch private matter-labs git dependencies over HTTPS.
      Composite actions cannot read the `secrets` context, so callers must
      pass `secrets.RELEASE_TOKEN` explicitly.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
    - if: inputs.release-token != ''
      shell: bash
      env:
        RELEASE_TOKEN: ${{ inputs.release-token }}
      run: |
        git config --global url."https://x-access-token:${RELEASE_TOKEN}@github.com/".insteadOf "https://github.com/"
        echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
    - shell: bash
      env:
        # cargo-airbender pulls in era_cudart_sys, whose build script panics
        # on runners without a CUDA toolkit unless stubs are enabled.
        ZKSYNC_USE_CUDA_STUBS: true
      run: |
        rustup set profile minimal
        cargo install cargo-binutils --locked
        cargo install cargo-airbender --git https://github.com/matter-labs/airbender-platform --rev ${{ inputs.rev }} --locked
