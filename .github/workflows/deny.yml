# Used in pull requests

name: Cargo deny check
on: pull_request
permissions: read-all
jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
    # The container action has a separate HOME and cannot see the Git URL
    # rewrite configured on the runner, so private dependencies must be
    # checked with cargo-deny installed directly on the host. Installed before
    # the checkout so it builds with the runner's default toolchain rather
    # than the nightly pinned by rust-toolchain.toml.
    - name: Install cargo-deny
      run: cargo install --locked cargo-deny@0.18.6

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configure private repo auth
      uses: ./.github/actions/private-git-auth
      with:
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Run cargo-deny
      run: cargo deny --manifest-path ./Cargo.toml check --allow unmaintained --hide-inclusion-graph

  cargo-deny-zksync-os:
    name: cargo-deny (zksync_os)
    runs-on: ubuntu-latest
    steps:
    - name: Install cargo-deny
      run: cargo install --locked cargo-deny@0.18.6

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Configure private repo auth
      uses: ./.github/actions/private-git-auth
      with:
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Run cargo-deny
      run: cargo deny --manifest-path zksync_os/Cargo.toml check --allow unmaintained --hide-inclusion-graph
