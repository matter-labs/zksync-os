name: "Rust CI"
on:
    push:
        branches:
            - main
    pull_request:
permissions: read-all

env:
    CARGO_INCREMENTAL: 0
    ZKSYNC_RISC_V_RUN: true
    CI: true

# Cancel previous runs that might be caused by appbin update
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build_riscv_binaries:
        name: Build RISC-V binaries
        runs-on: [matterlabs-ci-runner-high-performance]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - name: Setup RISC-V toolchain
              run: |
                  rustup set profile minimal
                  rustup target add riscv32i-unknown-none-elf
                  cargo install cargo-binutils
                  rustup component add llvm-tools-preview
                  rustup component add rust-src
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      zksync_os
                      crypto/src/blake2s/test_program
            - name: Build zksync_os binaries
              working-directory: ./zksync_os
              run: |
                  ./dump_bin.sh --type for-tests
                  ./dump_bin.sh --type multiblock-batch
                  ./dump_bin.sh --type singleblock-batch
                  ./dump_bin.sh --type eth-stf
            - name: Build blake test programs
              working-directory: ./crypto/src/blake2s/test_program
              run: ./dump_bin.sh
            - uses: actions/upload-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
                  retention-days: 1
            - uses: actions/upload-artifact@v4
              with:
                  name: blake-binaries
                  path: crypto/src/blake2s/test_program/dist/
                  retention-days: 1

    tests:
        name: tests
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-high-performance]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - uses: actions/download-artifact@v4
              with:
                  name: blake-binaries
                  path: crypto/src/blake2s/test_program/dist/
            - name: Compile
              run: cargo test --release --no-run
            - name: Run rust tests
              run: cargo test --release

    test_revm_consistency:
        name: revm consistency checker tests
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-high-performance]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - uses: actions/download-artifact@v4
              with:
                  name: blake-binaries
                  path: crypto/src/blake2s/test_program/dist/
            - name: Compile
              run: cargo test --release --no-run
            - name: Run rust tests
              run: ZKSYNC_REVM_CONSISTENCY_CHECK=true ZKSYNC_RISC_V_RUN=false cargo test --release

    crypto_test:
        name: crypto crate tests
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-high-performance]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - uses: actions/download-artifact@v4
              with:
                  name: blake-binaries
                  path: crypto/src/blake2s/test_program/dist/
            - name: Run crypto tests 10 times with overflow checks
              run: |
                  for i in {1..10}; do
                    RUSTFLAGS="-C overflow-checks=on -C debug-assertions=on" cargo test -p crypto --quiet || exit 1
                  done

    evm_state_tests:
        name: EF EVM state tests
        runs-on: [matterlabs-ci-runner-high-performance]
        steps:
            - uses: actions/checkout@v4
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: tests/evm_tester
            - name: Setup
              run: |
                  rustup toolchain install
                  rustup set profile minimal
                  cargo install cargo-binutils
            - name: Download ethereum execution spec tests fixtures
              working-directory: ./tests/evm_tester
              run: |
                  ./download_ethereum_fixtures.sh
            - name: Run EVM state tests
              working-directory: ./tests/evm_tester
              run: cargo run --bin evm-tester --release --features zksync_os_forward_system/no_print

    verify_binary:
        name: Verify binary
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - name: Run binary checker
              run: cargo test -p binary_checker -- --nocapture --ignored

    e2e_prove:
        name: e2e_prove
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-c3d]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - name: Run proving test
              # Runs with e2e_proving feature
              run: cargo test --release -p transactions --features e2e_proving run_base_system -- --nocapture

    eth_stf_run:
        name: eth_stf_run
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-highmem]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: tests/instances/eth_runner
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - name: Run ethereum block
              working-directory: ./tests/instances/eth_runner
              run: cargo run --release --features rig/eth_stf -- eth-run --block-dir 23846054

    blake_tests:
        name: blake_tests
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner-highmem]
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
            - name: Setup RISC-V toolchain
              run: |
                  rustup set profile minimal
                  rustup target add riscv32i-unknown-none-elf
                  cargo install cargo-binutils
                  rustup component add llvm-tools-preview
                  rustup component add rust-src
            - name: Compile for RISC-V
              working-directory: ./crypto/src/blake2s/test_program
              run: ./dump_bin.sh --type for-tests
            - name: Run proving test
              working-directory: ./crypto/src/blake2s
              run: |
                  cargo test --release run_naive_test
                  cargo test --release run_extended_delegation_test

    formatting:
        name: cargo fmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: rustfmt
            - name: Rustfmt Check
              uses: actions-rust-lang/rustfmt@v1

    clippy:
        name: Clippy Lint Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - name: Run Clippy
              run: |
                  cargo clippy --all -- -D warnings

    typos:
        name: typos check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: crate-ci/typos@master
              with:
                  config: ./.github/typos.toml

    run_fuzzer_regressions:
        name: Run fuzzer regressions
        needs: [build_riscv_binaries]
        runs-on: [matterlabs-ci-runner]
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: "20"
            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: tests/fuzzer
            - uses: actions/download-artifact@v4
              with:
                  name: riscv-binaries
                  path: zksync_os/dist/
            - name: Run regression tests
              working-directory: ./tests/fuzzer
              run: |
                  ./fuzz.sh install
                  ./fuzz.sh regression

    check_app_bin:
        name: Check that binaries can be built
        runs-on: [matterlabs-ci-runner]
        steps:
            - uses: actions/checkout@v4

            - name: Build fresh app bin
              run: |
                  zksync_os/reproduce/reproduce.sh
