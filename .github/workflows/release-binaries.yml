name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: read

# Log all shell steps
defaults:
  run:
    shell: bash -ex {0}

jobs:
  build_binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build binaries using reproducible script
        run: zksync_os/reproduce/reproduce.sh

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts

          # Map app_name -> output filename for release
          declare -A APPS=(
            [for_tests]="for_tests.bin"
            [evm_replay]="evm_replay.bin"
            [singleblock_batch]="singleblock_batch.bin"
            [singleblock_batch_logging_enabled]="singleblock_batch_logging_enabled.bin"
            [multiblock_batch]="multiblock_batch.bin"
            [multiblock_batch_logging_enabled]="multiblock_batch_logging_enabled.bin"
          )

          for APP_NAME in "${!APPS[@]}"; do
            SRC="zksync_os/dist/${APP_NAME}/app.bin"
            DEST="release-artifacts/${APPS[$APP_NAME]}"
            if [ -f "$SRC" ]; then
              cp "$SRC" "$DEST"
              echo "Copied $SRC -> $DEST"
            else
              echo "WARNING: $SRC not found"
            fi
          done

          cd release-artifacts

          # Create checksums
          sha256sum *.bin > checksums.txt

          # List all files
          echo "Release artifacts:"
          ls -la

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.bin
            release-artifacts/checksums.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}