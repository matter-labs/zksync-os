# This workflow just builds the fuzz targets without running them.
name: Daily Fuzz Build

on:
    schedule:
        - cron: "0 1 * * *"

permissions: read-all

env:
    ZKSYNC_RISC_V_RUN: true
    CI: true
    ZKSYNC_USE_CUDA_STUBS: true

jobs:
    build-fuzz-targets:
        name: Build fuzz targets
        runs-on: [matterlabs-ci-runner]
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - uses: ./.github/actions/setup-toolchain
              with:
                  release-token: ${{ secrets.RELEASE_TOKEN }}

            - name: Compile for RISC-V
              working-directory: ./zksync_os
              run: ./dump_bin.sh --type for-tests

            - name: Compile for forward running
              run: cargo build --release

            - name: Install cargo-fuzz
              run: cargo install cargo-fuzz

            - name: Build fuzz tests
              run: |
                  cd tests/fuzzer
                  cargo fuzz build -D

            - name: Run regression tests
              run: |
                  cd tests/fuzzer
                  ./fuzz.sh regression

            - name: Run smoke fuzz tests
              run: |
                  cd tests/fuzzer
                  ./fuzz.sh smoke
