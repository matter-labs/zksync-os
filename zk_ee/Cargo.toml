[package]
name = "zk_ee"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ruint = { workspace = true, default-features = false, features = ["serde"] }
arrayvec = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"], optional = true  }

u256 = { path = "../supporting_crates/u256", default-features = false }
cfg-if = { workspace = true }
crypto = { workspace = true }
cycle_marker = { path = "../cycle_marker" }
strum_macros = { workspace = true }
paste = { workspace = true }

[features]
# serde derivation has to be disabled for risc-v target until we update ruint version
serde = ["dep:serde", "ruint/serde"]
testing = ["serde"]
default = ["serde", "error_origins", "detailed_errors"]
cycle_marker = ["cycle_marker/log_to_file"]
global-alloc = []
# Indicates the crate is being built for the proving environment.
# Use this instead of cfg(target_arch = "riscv32") when the intent is proving
# vs forward mode, not actual RISC-V hardware detection.
proving_env = []
# Adds location (file, line number) where an error is raised
error_origins = []
detailed_errors = []
prevrandao = []
delegation = ["u256/delegation"]
# Selects the BPO2 blob-count schedule; default is base-Osaka.
fusaka-bpo-2 = []

[dev-dependencies]
