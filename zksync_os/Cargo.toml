[package]
name = "zksync_os"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
airbender = { package = "airbender-sdk", git = "https://github.com/matter-labs/airbender-platform", rev = "7e559f95", default-features = false, features = ["allocator-custom"] }
proof_running_system = { path = "../proof_running_system", default-features = false }
crypto = { path = "../crypto", optional = true }
riscv_common = {git = "https://github.com/matter-labs/zksync-airbender", branch = "dev", features = ["custom_panic", "custom_allocator"]}
basic_bootloader = { path = "../basic_bootloader", default-features = false }
full_statement_verifier = { git = "https://github.com/matter-labs/zksync-airbender.git", branch = "dev", default-features = false, features = ["unified_verifier_only_security_80", "modular_ops", "blake2_with_compression"] }

[profile.dev]
opt-level = 0
lto = false
codegen-units = 1
panic = "abort"
debug = true

[profile.dev.overrides."*"]
opt-level = 0
lto = false
codegen-units = 1
panic = "abort"
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.release.overrides."*"]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

[features]
scalloc = ["proof_running_system/scalloc"]
print_debug_info = ["proof_running_system/error_origins", "proof_running_system/global-alloc"]
proving = ["crypto/proving", "proof_running_system/proving"]
benchmarking = ["proof_running_system/benchmarking"]
production = ["proof_running_system/production"]
for_tests = ["proof_running_system/for_tests"]
eth_runner = ["proof_running_system/eth_runner"]
eth_stf = ["proof_running_system/eth_stf"]
evm_tester = ["proof_running_system/evm_tester"]
multiblock-batch = ["proof_running_system/multiblock-batch"]
state-diffs-pi = ["proof_running_system/state-diffs-pi"]
