[package]
name = "evm-tester"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[[bin]]
name = "evm-tester"
path = "src/evm_tester/main.rs"

[lib]
doctest = false

[dependencies]
structopt = { version = "0.3", default-features = false }
anyhow = { workspace = true }
colored = "2"

serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
serde_yaml = "0.9"
md5 = "0.7"
hex = { workspace = true }
regex = "1"
itertools = "0.13"
rayon = "1"
lazy_static = "1"

ruint = { workspace = true, features = ["primitive-types"] }
alloy = { workspace = true, features = ["full", "eip712", "consensus"] }

zksync_os_forward_system = { package = "forward_system", path = "../../forward_system" }
zk_ee = { path = "../../zk_ee" }
zksync_os_basic_bootloader = { package = "basic_bootloader", path = "../../basic_bootloader" }
zksync_os_rig = { package = "rig", path = "../../tests/rig", features = ["evm_tester"] }

[features]
default = ["evm_tester_fusaka"]
pectra = ["zksync_os_forward_system/pectra"]
evm_tester_pectra = ["zksync_os_forward_system/evm_tester_pectra"]
fusaka = ["zksync_os_forward_system/fusaka"]
evm_tester_fusaka = ["zksync_os_forward_system/evm_tester_fusaka"]
# Opt-in: test against the latest BPO blob-count schedule instead of base Osaka.
fusaka-blobs = ["zksync_os_forward_system/fusaka-blobs"]
