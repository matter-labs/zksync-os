[workspace]

[package]
name = "fri_verifier_runner"
version = "0.1.0"
edition = "2021"
publish = false

# This crate is an isolated host-side smoke test for the airbender
# recursion-layer FRI verifier, targeting proofs produced by zksync-os-server
# at proving version V6 (airbender v0.5.2).
#
# `fri_3291.bin` (or whatever file `FRI_ORACLE_PATH` points at) is the raw
# bytes of `RealFriProof::proof()` as stored and served by the server — i.e.
# a `bincode`-serialized `execution_utils::ProgramProof`, encoded with
# `bincode::config::standard()`. The test decodes it, flattens it into the
# `Vec<u32>` oracle stream via
# `execution_utils::generate_oracle_data_from_metadata_and_proof_list`,
# feeds it to the thread-local non-determinism source, and calls
# `full_statement_verifier::verify_recursion_layer`. This is a direct mirror
# of the server's `fri_proof_verifier::verify_fri_proof` pipeline.
#
# The airbender crates are pinned to tag `v0.5.2` to match the server and the
# proof's proving version. They intentionally do not share a lockfile with
# the root zksync-os workspace (this crate is listed in the root `exclude`
# table), so enabling `replace_csr` here does not perturb feature unification
# for the proving pipeline.

[dependencies]
full_statement_verifier = { git = "https://github.com/matter-labs/zksync-airbender.git", tag = "v0.5.2", default-features = false, features = ["blake2_with_compression", "replace_csr"] }
execution_utils = { git = "https://github.com/matter-labs/zksync-airbender.git", tag = "v0.5.2" }
bincode = { version = "2.0.1", features = ["serde"] }
