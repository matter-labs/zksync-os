[workspace]

[package]
name = "fri_verifier_runner"
version = "0.1.0"
edition = "2021"
publish = false

# This crate is an isolated host-side smoke test for the Airbender unified
# recursion verifier, targeting gzip-compressed `UnrolledProgramProof` blobs
# produced by `ethereum-prover`. It mirrors the verifier path implemented in
# `ethereum-prover/proof_verifier_js/wasm`.

[dependencies]
full_statement_verifier = { git = "https://github.com/matter-labs/zksync-airbender.git", branch = "dev", default-features = false, features = ["unified_verifier_only_security_80", "replace_csr"] }
prover = { git = "https://github.com/matter-labs/zksync-airbender.git", branch = "dev", default-features = false, features = ["definitions_only"] }
verifier_common = { git = "https://github.com/matter-labs/zksync-airbender.git", branch = "dev", default-features = false, features = ["proof_utils"] }
cs = { git = "https://github.com/matter-labs/zksync-airbender.git", branch = "dev", default-features = false, features = ["compiler"] }
bincode = { version = "2.0.1", features = ["serde"] }
hex = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
zksync_os_runner = { path = "../../zksync_os_runner", features = ["cycle_marker"] }
riscv_transpiler = { git = "https://github.com/matter-labs/zksync-airbender.git", rev = "73f46c2bc86cdcefb878d6675abfcfc0eaf04607" }

[patch."https://github.com/matter-labs/zksync-airbender.git"]
riscv_transpiler = { path = "/tmp/zksync-airbender-dev/riscv_transpiler" }
full_statement_verifier = { path = "/tmp/zksync-airbender-dev/full_statement_verifier" }
prover = { path = "/tmp/zksync-airbender-dev/prover" }
verifier_common = { path = "/tmp/zksync-airbender-dev/verifier_common" }
cs = { path = "/tmp/zksync-airbender-dev/cs" }
field = { path = "/tmp/zksync-airbender-dev/field" }
worker = { path = "/tmp/zksync-airbender-dev/worker" }
blake2s_u32 = { path = "/tmp/zksync-airbender-dev/blake2s_u32" }
common_constants = { path = "/tmp/zksync-airbender-dev/common_constants" }

[patch."https://github.com/matter-labs/zksync-airbender"]
riscv_transpiler = { path = "/tmp/zksync-airbender-dev/riscv_transpiler" }
full_statement_verifier = { path = "/tmp/zksync-airbender-dev/full_statement_verifier" }
prover = { path = "/tmp/zksync-airbender-dev/prover" }
verifier_common = { path = "/tmp/zksync-airbender-dev/verifier_common" }
cs = { path = "/tmp/zksync-airbender-dev/cs" }
field = { path = "/tmp/zksync-airbender-dev/field" }
worker = { path = "/tmp/zksync-airbender-dev/worker" }
blake2s_u32 = { path = "/tmp/zksync-airbender-dev/blake2s_u32" }
common_constants = { path = "/tmp/zksync-airbender-dev/common_constants" }
