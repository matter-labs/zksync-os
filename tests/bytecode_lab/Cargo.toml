[package]
name = "bytecode_lab"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "evm"]
categories = ["cryptography"]
description = "The bytecode lab: a deterministic differential and stress runner for program_gen programs against ZKsync OS."

# Own `[workspace]` table so this crate is excluded from the root workspace,
# exactly like `tests/fuzzer`. It enables `forward_system/production` (P-256)
# and `rig/no_print`, features that would otherwise leak into the rest of the
# workspace through feature unification. A nested crate that declares its own
# workspace is auto-ignored by the parent, so no root `Cargo.toml` edit is
# needed. Being its own workspace also gives it an independent `Cargo.lock`.
[workspace]

[[bin]]
name = "bytecode-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["std", "derive"] }
serde_json = "1"
serde_yaml = "0.9"
hex = "0.4.3"
# A reproducible driver needs the same stable PRNG algorithm program_gen uses
# (ChaCha8): same seed, same cases, same signer keys, on any machine.
rand = "0.9"
rand_chacha = "0.9"

program_gen = { path = "../program_gen" }
rig = { path = "../rig", features = ["no_print"] }
zksync_os_tests_common = { path = "../common" }
zksync_os_revm_runner = { path = "../revm_runner" }
zk_ee = { path = "../../zk_ee" }
# The lab compares against the production EVM surface, including the P-256
# precompile, exactly like evm_divergence_validator. Do not drop this feature.
forward_system = { path = "../../forward_system", features = ["production"] }

# The Airbender dependency graph triggers an LLVM/DWARF SIGBUS on this toolchain
# when compiling debug-info-heavy host builds, so mirror the root workspace and
# strip debug info from the dev/test profiles (clippy compiles the dev profile).
[profile.dev]
debug = false

[profile.test]
debug = false
