[package]
name = "system_hooks_tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rig = { path = "../../rig", features = ["for_tests"] }
zksync_os_tests_common = { path = "../../common" }
hex = { workspace = true }
alloy-sol-types = { workspace = true }

# Needed by the real-proof end-to-end FRI precompile test to simulate the
# submitter side: decode the fixture, run the host-side verifier, and derive
# `statement_versioned_hash`. The responder-side decode/flatten lives in
# forward_system; these deps exist here only for the submitter simulation.
execution_utils = { workspace = true, optional = true }
full_statement_verifier = { workspace = true, optional = true, default-features = false, features = ["unified_verifier_only_security_100", "blake2_with_compression", "replace_csr"] }
riscv_transpiler = { workspace = true, optional = true }
cycle_marker = { path = "../../../cycle_marker", optional = true }
flate2 = { version = "1", optional = true }
bincode = { version = "2.0.1", features = ["serde"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
e2e_proving = ["rig/e2e_proving"]
cycle_marker = ["rig/cycle_marker"]
pectra = ["rig/pectra"]
fri_precompile = [
    "rig/fri_precompile",
    "dep:bincode",
    "dep:cycle_marker",
    "dep:execution_utils",
    "dep:flate2",
    "dep:full_statement_verifier",
    "dep:riscv_transpiler",
    "dep:serde",
]
