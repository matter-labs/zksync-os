[package]
name = "eth_runner"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
ruint = { workspace = true }

alloy = { workspace = true, features = ["full", "ssz"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
rig = { path = "../../rig", features = ["eth_runner"] }
zk_ee = { path = "../../../zk_ee" }
basic_system = { path = "../../../basic_system" }
forward_system = { path = "../../../forward_system" }
clap = { version = "4.4", features = ["derive"] }
anyhow = { workspace = true }
ureq = { version = "3", features = ["json", "gzip"] }
sled = { version = "0.34" }
bincode = { version = "2", features = ["serde"] }
alloy-rpc-types-debug = { workspace = true }
csv = "1.3"
reqwest = { workspace = true, features = ["json", "blocking", "rustls-tls"] }
zstd = "0.13"

airbender-host = { workspace = true }

[features]
proving = []
gpu = ["airbender-host/gpu-prover"]
default = []

# Fast-compile variant used by the bench CI for the host-side eth_runner
# binary. Its runtime perf doesn't affect cycle measurements (cycles come
# from the RISC-V simulator), so disable LTO and parallelize codegen for
# much faster CI builds.
#
# Mirrors `[profile.bench-fast]` in the root workspace's `Cargo.toml`
# (`eth_runner` is excluded from that workspace; the root profile only
# covers the in-workspace `-p precompiles` build path). Keep the two in sync.
[profile.bench-fast]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
debug = false
