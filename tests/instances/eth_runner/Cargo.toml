[package]
name = "eth_runner"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
ruint = { workspace = true }

alloy = { workspace = true, features = ["full", "ssz"] }
serde_json = { workspace = true, features = ["unbounded_depth"] }
rig = { path = "../../rig", features = ["eth_runner"] }
zk_ee = { path = "../../../zk_ee" }
basic_system = { path = "../../../basic_system" }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1"
ureq = { version = "3", features = ["json", "gzip"] }
sled = { version = "0.34" }
bincode = { version = "2", features = ["serde"] }
alloy-rpc-types-debug = { workspace = true }
csv = "1.3"
reqwest = { workspace = true, features = ["json", "blocking", "rustls-tls"] }
zstd = "0.13"

airbender-host = { workspace = true, default-features = false }

[features]
proving = []
gpu = ["airbender-host/gpu-prover"]
default = []

