[package]
name = "test_program"
version = "0.1.0"
edition = "2021"
authors = ["The Matter Labs Team <hello@matterlabs.dev>"]
homepage = "https://zksync.io/"
repository = "https://github.com/matter-labs/zksync-os/"
license = "MIT OR Apache-2.0"
keywords = ["blockchain", "zksync", "zk", "risc-v"]
categories = ["cryptography"]

[dependencies]
airbender = { package = "airbender-sdk", git = "https://github.com/matter-labs/airbender-platform", rev = "ff643be8" }
crypto = { git = "https://github.com/vibelyova/airbender-platform", rev = "25591cb2", package = "airbender-crypto", default-features = false, features = ["blake2s_tests"]}

[workspace]

[features]
single_round_with_control = ["crypto/single_round_with_control"]
