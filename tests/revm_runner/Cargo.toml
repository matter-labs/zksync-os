[package]
name = "zksync_os_revm_runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
alloy = { workspace = true, default-features = false, features = [
    "eips",
    "rpc",
    "rpc-types",
    "rpc-types-trace",
    "serde",
    "serde-bincode-compat",
] }
ruint = { workspace = true, default-features = false, features = ["alloc"] }
revm = "=42.0.1"
revm-inspectors = "0.42.2"
log = { workspace = true }

# Pinned to the v0.2.0 release: AtlasV4, the apply_pre_block_system_calls
# helper (matter-labs/zksync-os-revm#19), the revm v42.0.1 bump (#21), and the
# merge that brings the two lines back together (#24).
zksync-os-revm = { git = "https://github.com/matter-labs/zksync-os-revm", tag = "v0.2.0" }
zksync_os_interface = { workspace = true, default-features = false }

zk_ee = { path = "../../zk_ee" }
basic_system = { path = "../../basic_system" }
basic_bootloader = { path = "../../basic_bootloader" }
forward_system = { path = "../../forward_system" }
zksync_os_api = { path = "../../api" }

zksync_os_tests_common = { path = "../common" }
