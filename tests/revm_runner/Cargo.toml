[package]
name = "zksync_os_revm_runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
alloy = { workspace = true, default-features = false, features = [
    "eips",
    "rpc",
    "rpc-types",
    "rpc-types-trace",
    "serde",
    "serde-bincode-compat",
] }
ruint = { workspace = true, default-features = false, features = ["alloc"] }
revm = "=38.0.0"
revm-inspectors = "0.39.0"
log = { workspace = true }

# TODO: repoint to matter-labs/zksync-os-revm (vv-new-version) once the
# apply_pre_block_system_calls PR (matter-labs/zksync-os-revm#19) merges, then to
# a tagged release once AtlasV4 is merged. This fork rev is 4daec8c (the previous
# pin) plus that helper.
zksync-os-revm = { git = "https://github.com/antoniolocascio-bot/zksync-os-revm", rev = "074fa6dcca64ab4e2226f65418a2d0e83d8bd1b2" }
zksync_os_interface = { workspace = true, default-features = false }

zk_ee = { path = "../../zk_ee" }
basic_system = { path = "../../basic_system" }
basic_bootloader = { path = "../../basic_bootloader" }
forward_system = { path = "../../forward_system" }
zksync_os_api = { path = "../../api" }

zksync_os_tests_common = { path = "../common" }
