[package]
name = "basic_bootloader"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zk_ee = { path = "../zk_ee", default-features = false }
cycle_marker = { path = "../cycle_marker" }
evm_interpreter = { path = "../evm_interpreter", default-features = false }
system_hooks = { path = "../system_hooks", default-features = false }
basic_system = { path = "../basic_system", default-features = false }
ruint = { workspace = true, default-features = false }
arrayvec = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"] }
wincode = { workspace = true }
crypto = { workspace = true }
hex = { workspace = true, optional = true }
strum_macros = { workspace = true }
paste = { workspace = true }
cfg-if = { workspace = true }
serde-big-array = "0.5"


[dev-dependencies]
alloy = { workspace = true, features = ["rlp", "full"] }
alloy-rlp = { workspace = true }
alloy-primitives = { workspace = true, features = ["arbitrary"] }

[features]
testing = ["zk_ee/testing", "evm_interpreter/testing", "basic_system/testing", "hex"]
default = ["testing"]
eip-2935 = []
eip-7702 = []
eip-7623 = []
eip-4844 = ["system_hooks/point_eval_precompile"]
pectra = ["eip-2935", "eip-7702", "eip-7623", "eip-4844", "zk_ee/pectra-blobs", "system_hooks/bls12_381", "system_hooks/blake2f"]
burn_base_fee = []
cycle_marker = ["system_hooks/cycle_marker", "cycle_marker/log_to_file"]
resources_for_tester = []
unlimited_native = []
disable_system_contracts = []
error_origins = ["zk_ee/error_origins"]
delegation = ["zk_ee/delegation", "evm_interpreter/delegation", "system_hooks/delegation", "basic_system/delegation"]
# Enables runtime verification that the intrinsic computational native formula
# (`calculate_l2_tx_intrinsic_computational_native_resources`) is an upper bound
# on the native resources actually consumed by validation and post-execution
# bookkeeping that it is meant to cover.
verify_intrinsic_native = []
