[package]
name = "basic_system"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
zk_ee = { path = "../zk_ee", default-features = false }
evm_interpreter = { path = "../evm_interpreter"  }
ruint = { version = "1.12.3", default-features = false, features = ["alloc"] }
crypto = { path = "../crypto", default-features = false, features = ["secp256k1-static-context"]}
arrayvec = { version = "0.7.4", default-features = false }
either = { version = "*", default-features = false }
system_hooks = { path = "../system_hooks", default-features = false }
storage_models = { path = "../storage_models", default-features = false }
cycle_marker = { path = "../cycle_marker" }

cfg-if = "1.0.0"
const_for = "0.1.5"

hex = {version = "*", optional = true}
rand = {version = "0.9.0", optional = true}
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }


[features]
testing = ["zk_ee/testing", "evm_interpreter/testing", "hex", "serde", "ruint/serde", "rand"]
evm-compatibility = []
default = ["testing"]
cycle_marker = []
wrap-in-batch = []

[dev-dependencies]
hex = {version = "0.4.3"}
proptest = "1.6.0"
serde_json = "*"
num-bigint = "*"
num-traits = "*"
alloy-rpc-types-debug = { version = "*", default-features = false }
eth-runner = { git = "git@github.com:matter-labs/zksync-os.git" }
# ress-primitives = { git = "https://github.com/paradigmxyz/ress.git", features = ["serde"] }
# # we have to directly import alloy as ress-primitives doesn't properly import features
# alloy-primitives = { version = "1.0.0", default-features = false, features = ["serde", ] }
# alloy-trie = { version = "0.8.1", default-features = false, features = ["serde", "ethereum"] }
