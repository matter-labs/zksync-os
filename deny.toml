[advisories]
ignore = [
    # quick-xml < 0.41 memory-exhaustion / quadratic-parse advisories. Pulled in
    # only transitively by `inferno` (flamegraph SVG rendering) via the
    # git-pinned `riscv_transpiler`, whose `inferno = "^0.12"` in turn pins
    # `quick-xml = "^0.39"`, so it cannot be bumped without moving those git
    # revs. It is host-side benchmarking/test tooling that never parses
    # untrusted XML and is not part of the proving runtime.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ruzstd < 0.9.1 decompression bomb. Pulled in only by `object` 0.37 (zstd-compressed ELF
    # sections) via `addr2line` 0.25 of the git-pinned `riscv_transpiler`; `object` takes
    # `ruzstd` 0.9 only from 0.40, which that `addr2line` cannot use. It reads the ELF files this
    # repository builds, not untrusted input, and is not part of the proving runtime.
    "RUSTSEC-2026-0344",
    # crypto-bigint 0.5 comes from elliptic-curve 0.13 (k256/p256 and Alloy).
    # The OS verifies public transaction signatures, so it does not process
    # secret scalars. The fixed 0.7 series requires upstream major upgrades.
    "RUSTSEC-2026-0387",
    # zstd 0.13 is used by host-side Reth/eth_runner tooling, not the proving
    # binary. eth_runner uses a fresh stream read decoder; Reth uses the bulk
    # API. Neither uses the affected reused-context, seekable, or stream write
    # decoder APIs. The zstd-sys issue is limited to wasm32, while these tools
    # run natively. Upgrade once the Reth dependency supports zstd 0.14.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
    # The same zstd-safe 7.2 series also has unsound low-level APIs involving
    # experimental buffers, seekable streams, dictionaries, and context cloning.
    # Reth's dependency uses only zstd's bulk compressor/decompressor, and
    # eth_runner uses a fresh stream read decoder. Neither calls these APIs.
    # zstd-safe 8.2 requires zstd 0.14, while Reth currently pins zstd 0.13.
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
]

[bans]
multiple-versions = "warn"
deny = []
skip = []
skip-tree = []

workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = [
    "https://github.com/matter-labs/zksync-airbender",
    "https://github.com/matter-labs/airbender-platform",
]

allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "CDDL-1.0",
]
exceptions = [
    # CC0 is a bit unclear about source code: https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
    { allow = ["CC0-1.0"], name = "tiny-keccak" },
    { allow = ["CC0-1.0"], name = "secp256k1-sys" },
    { allow = ["CC0-1.0"], name = "secp256k1" },
    { allow = ["CC0-1.0"], name = "aurora-engine-modexp" },
    { allow = ["OpenSSL"], crate = "ring" },
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
]

# Sigh
[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# Actually "ISC-style"
[[licenses.clarify]]
crate = "rustls-webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]
